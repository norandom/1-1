# Task 4.1 compile probe — the RESOLVED IronRDP component set (see research.md, task 4.1).
#
# Pinned EXACTLY (=) so the lockfile recorded here is the evidence for tasks 4.2/4.3.
# The main src-tauri manifest is NOT touched by the spike; it adopts this set later.
#
# Feature-graph decisions (mirrors the recorded resolution):
# - ironrdp-egfx with NO features: openh264/openh264-bundled/openh264-libloading stay
#   OFF (Req 9.1/9.5 — the build must carry no H.264 decoder).
# - ironrdp-tls `rustls-ring`: in the 0.3 train the plain `rustls` feature now maps to
#   aws-lc-rs; `rustls-ring` keeps the ring CryptoProvider path Drift installs today.
# - ironrdp-tokio `reqwest`: same feature Drift's transport uses today
#   (client.rs: ReqwestNetworkClient + connect_begin via the ironrdp-async re-export).
# - ironrdp-dvc without `std`: exactly how ironrdp-egfx/-session consume it; the probe
#   compiles the same way to prove the hosted build needs no extra feature wiring.

[package]
name = "probe-ironrdp-egfx-05"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
ironrdp-egfx = { version = "=0.5.0", default-features = false }
ironrdp-pdu = "=0.11.0"
ironrdp-core = "=0.3.1"
ironrdp-graphics = "=0.11.0"
ironrdp-dvc = "=0.10.0"
ironrdp-svc = "=0.10.0"
ironrdp-session = "=0.13.0"
ironrdp-connector = "=0.12.0"
ironrdp-input = "=0.9.0"
ironrdp-cliprdr = "=0.9.0"
ironrdp-displaycontrol = "=0.10.0"
ironrdp-tokio = { version = "=0.12.0", features = ["reqwest"] }
ironrdp-tls = { version = "=0.3.0", features = ["rustls-ring"] }
sspi = "=0.23.0"

# - sspi pinned to 0.23.0 (NOT 0.23.1): connector 0.12.0 and sspi 0.23.1 pin
#   conflicting picky release candidates (=7.0.0-rc.26 vs =7.0.0-rc.27); sspi 0.23.0
#   pins rc.26 and co-resolves with the 2026-10-27/28 IronRDP train. Exact versions
#   matter here — this conflict is the core resolution finding of task 4.1.
