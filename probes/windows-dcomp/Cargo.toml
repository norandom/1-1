# Spike: can 1-1 draw remote frames on Windows below a transparent WebView2,
# without wry's composition controller? A wgpu (DX12) swap chain in a
# DirectComposition visual on the window's non-topmost target (below child
# windows, so below WebView2), and the page leaves a hole for it. Compared
# with the current path: the same 60 Hz pattern drawn into a web canvas.
# Versions match src-tauri/Cargo.lock (copied as this probe's lockfile).

[package]
name = "probe-windows-dcomp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
wgpu = "24"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition"] }
