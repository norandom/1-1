# Spike: can 1-1 draw remote frames on Linux without the GTK 3 full-window
# software repaint? A wgpu layer in its own Wayland subsurface, placed below a
# transparent Tauri web view that leaves a hole for it. Compared with the
# current path: the same 60 Hz pattern drawn into a web canvas.
# Versions match src-tauri/Cargo.lock (copied as this probe's lockfile).

[package]
name = "probe-native-subsurface"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
wgpu = "24"
raw-window-handle = "0.6"
pollster = "0.4"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkwayland-sys = "0.18"
webkit2gtk = "2.0"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
