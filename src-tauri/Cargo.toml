[package]
name = "rdp-client"
version = "0.1.0-alpha.7"
description = "1-1 is a remote desktop client for Windows, macOS, and Linux."
authors = ["you"]
license = "MIT"
repository = ""
edition = "2024"
# MSRV of the pinned IronRDP 2026-10-27/28 train (task 4.1 resolved set,
# research.md §4.1): every train crate declares rust-version 1.94
# (sspi 0.23.0 declares 1.93). Supersedes the facade-era 1.77.2.
rust-version = "1.94"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Task 5.3 build gate (design "SessionActor changes"): synthetic (mock)
# sessions, their loss/cancel controls, E2E fixture seeding and the
# harness-owned storage namespaces exist ONLY in builds that explicitly opt
# in. Never default: production builds reject mock-session requests
# (Req 12.2/12.10) and register none of the debug commands.
test-support = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-clipboard-manager = "=2.3.0"
# A second launch (1-1 import ...) hands its arguments to the running window.
tauri-plugin-single-instance = "=2.5.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# keyring platform stores (task 5.1, Req 8.2): windows-native routes
# Windows credentials to the real Credential Manager; without it keyring
# falls back to its in-process mock store (nothing persists). On Linux,
# linux-native alone is the kernel session keyring, which loses passwords at
# logout; linux-native-sync-persistent stores them in the Secret Service
# (GNOME Keyring, KWallet) with keyutils as a cache. crypto-rust avoids OpenSSL.
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "crypto-rust", "windows-native"] }
dirs = "5"
# IronRDP component crates — the task 4.1 resolved set (research.md §4.1),
# pinned exactly (`=`) like the registry-verified compile probe
# (probes/ironrdp-egfx-05). The `ironrdp` facade is dropped on purpose: the
# newest facade (0.17.0) pins an older component train (connector ^0.10,
# pdu ^0.9, sspi ^0.21) that cannot co-resolve with this set.
ironrdp-connector = "=0.12.0"
ironrdp-pdu = "=0.11.0"
ironrdp-core = "=0.3.1"
ironrdp-graphics = "=0.11.0"
ironrdp-session = "=0.13.0"
ironrdp-dvc = "=0.10.0"
ironrdp-svc = "=0.10.0"
ironrdp-input = "=0.9.0"
ironrdp-cliprdr = "=0.9.0"
ironrdp-rdpdr = "=0.9.0"
ironrdp-displaycontrol = "=0.10.0"
# no features: openh264/openh264-bundled/openh264-libloading stay OFF
# (Req 9.1/9.5 — no H.264 decoder in the build).
ironrdp-egfx = { version = "=0.5.0", default-features = false }
# ironrdp-tls: `rustls-ring`, NOT `rustls` — in the 0.3 train the plain
# `rustls` feature maps to aws-lc-rs; `rustls-ring` keeps the ring
# CryptoProvider path Drift installs today.
ironrdp-tls = { version = "=0.3.0", features = ["rustls-ring"] }
ironrdp-tokio = { version = "=0.12.0", features = ["reqwest"] }
# sspi pinned to 0.23.0 (NOT 0.23.1): connector 0.12.0 and sspi 0.23.1 pin
# conflicting picky release candidates (=7.0.0-rc.26 vs =7.0.0-rc.27);
# sspi 0.23.0 pins rc.26 and co-resolves with the train. No feature here
# activates sspi's optional rustls (that would pull aws-lc-rs).
sspi = "=0.23.0"
# x509-cert aligned with ironrdp-tls 0.3 (extract_tls_server_public_key
# takes the 0.3 Certificate type).
x509-cert = "0.3"
sha2 = "0.10"
rustls-native-certs = "0.8"
# aws-lc-rs kept OUT of the Windows build chain: both crates pin the ring
# provider explicitly and disable the aws-lc-rs defaults.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
wgpu = "24"
pollster = "0.4"
raw-window-handle = "0.6"
# Task 6.2 (design "CI ownership and reuse decisions"): tempfile promoted
# from dev-dependency after the spike proved NamedTempFile new_in/persist
# same-directory staging, atomic replace and failure preservation
# (src/store/atomic_write.rs). Not a second writer crate.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
ironrdp-rdpdr-native = "=0.9.0"
# The shell's IFileOpenDialog with FOS_PICKFOLDERS supplies the native folder picker;
# FileSystem reads the chosen directory's volume and file identity.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
# Mark the large-offset fixture sparse before extending the file.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
# Tokio "full" does not include test-util; paused-clock tests (task 3.2) need it.
tokio = { version = "1", features = ["test-util"] }

# Keep iterative app/test builds bounded; dependencies retain their existing cache.
# Override temporarily only for an explicit debugger investigation, then clean it.
[profile.dev.package.rdp-client]
debug = 0
incremental = false

[profile.test.package.rdp-client]
debug = 0
incremental = false

